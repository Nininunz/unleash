name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Bash 3.2 checks
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        shell: /bin/bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install development tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: |
          brew install shellcheck bats-core parallel
          # Prefer system Bash in Bats and subprocesses as well as workflow steps.
          echo "/bin" >> "$GITHUB_PATH"
      - name: Report tools and verify Bash compatibility environment
        run: |
          test "${BASH_VERSINFO[0]}.${BASH_VERSINFO[1]}" = 3.2
          bash --version
          python3 --version
          shellcheck --version
          bats --version
          parallel --version
      - name: Run lint, tests, and standalone consistency check
        run: make ci BATS_FLAGS='--jobs 3 --no-parallelize-within-files'
